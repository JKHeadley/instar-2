# The three document checks the rule book names, run on every pull request and on main.
# Until this workflow existed the checks were scripts a person had to remember to run —
# exactly the 1.x failure this repository exists to avoid (rule 73: a dark enforcer guards nothing).
name: document-checks
on:
  pull_request:
  push:
    branches: [main]
# Added because Actions concurrency is allotted PER ACCOUNT, shared with the sibling
# repo, and this workflow was the dominant consumer. Measured 2026-10-20: 10 jobs
# running + 25 queued here while the sibling repo had 0 running + 21 queued against a
# shared 20-job allowance. Grouping by branch collapses the queued set from 25 to 9,
# because the repeats are heavy (two branches at x5, three at x3) rather than one run
# per branch.
#
# The key resolves a pull_request event and a push to the same branch into ONE group:
# `on:` fires for both, so every push to a branch with an open pull request was
# starting two full runs of the same commit. There is no pull_request_review trigger
# here, so collapsing them loses no signal.
#
# `cancel-in-progress` deliberately excludes main: a post-merge run is the record that
# a merge was sound, and cancelling it would destroy that evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the governed-document check counts approved versions on main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: changelogs carry every required field (rule 91)
        run: node scripts/validate-changelog.mjs docs/*.changelog.json docs/harvests/*.changelog.json
      - name: generated changelog markdown is current (rule 91)
        run: |
          node scripts/render-changelog.mjs docs/*.changelog.json docs/harvests/*.changelog.json
          git diff --exit-code -- '*.changelog.md'
      - name: no history markers in a governed body (rule 91)
        run: node scripts/check-governed-docs.mjs docs
      - name: no whitespace errors
        run: git diff --check origin/main...HEAD || git diff --check HEAD~1
      - name: every change is bound to its review record (rules 74, 109, 90)
        run: node scripts/check-change-review.mjs check
