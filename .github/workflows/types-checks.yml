name: constitutional-types
on: [push, pull_request]
# Added because Actions concurrency is allotted PER ACCOUNT, shared with the sibling
# repo, and this workflow was the dominant consumer. Measured 2026-10-20: 10 jobs
# running + 25 queued here while the sibling repo had 0 running + 21 queued against a
# shared 20-job allowance. Grouping by branch collapses the queued set from 25 to 9,
# because the repeats are heavy (two branches at x5, three at x3) rather than one run
# per branch.
#
# The key resolves a pull_request event and a push to the same branch into ONE group:
# `on:` fires for both, so every push to a branch with an open pull request was
# starting two full runs of the same commit. There is no pull_request_review trigger
# here, so collapsing them loses no signal.
#
# `cancel-in-progress` deliberately excludes main: a post-merge run is the record that
# a merge was sound, and cancelling it would destroy that evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: node -e "if (process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - run: node scripts/p2-determinism.mjs p2-output.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-${{ matrix.arch }}
          path: p2-output.json
      - uses: actions/upload-artifact@v4
        with:
          name: register-${{ matrix.os }}
          path: generated/register.json
  cross-architecture:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-*
          path: outputs
      - run: cmp outputs/p2-x64/p2-output.json outputs/p2-arm64/p2-output.json
  register-determinism:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: register-*
          path: register-artifacts
      - name: P3-NF-07 compare independently verified architecture outputs
        run: cmp register-artifacts/register-ubuntu-latest/register.json register-artifacts/register-ubuntu-24.04-arm/register.json
  p3-body-seam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - run: node scripts/test-p3-body-seam.mjs .
